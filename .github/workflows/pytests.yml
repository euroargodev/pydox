name: CI tests
# CI tests run every time new code is pushed to the repo

on:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - 'dependabot*'
  workflow_dispatch: # allows to trigger the workflow manually if necessary

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    defaults:
      run:
        shell: bash -l {0}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        experimental: [false]

    name: Pinned - Py${{matrix.python-version}} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}

    steps:

      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set environment variables
        run: |
          echo "CONDA_ENV_FILE=ci/requirements/py${{matrix.python-version}}-all-pinned.yml" >> $GITHUB_ENV
          echo "PYTHON_VERSION=${{ matrix.python-version }}" >> $GITHUB_ENV
          echo "LOG_FILE=pydox-tests-All-Pinned-Py${{matrix.python-version}}-${{matrix.os}}.log" >> $GITHUB_ENV


      - name: Setup Micromamba ${{ matrix.python-version }}
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: ${{ env.CONDA_ENV_FILE }}
          environment-name: pydox-dev
          init-shell: bash
          cache-environment: true # change to false to remove mamba env. in the cache
                                  # When true, github save the env. in the cache.
                                  # The first run can be long, the following are faster
          cache-environment-key: "${{runner.os}}-${{runner.arch}}-py${{matrix.python-version}}-${{env.TODAY}}-${{hashFiles(env.CONDA_ENV_FILE)}}"
          create-args: >-
            python=${{matrix.python-version}}


      - name: Install pydox
        run: |
          python -m pip install --no-deps -e .


      - name: Version info
        run: |
          micromamba info
          micromamba list


      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics


      - name: Test with pytest
        run: |
          pytest -ra -v -s -c pydox/tests/pytest.ini --durations=10 --cov=./ --cov-config=.coveragerc --cov-report xml:cov.xml --cov-report term-missing --log-file=${{env.LOG_FILE}} --junitxml=junit.xml -o junit_family=legacy


      - name: Save tests log as artifact
        uses: actions/upload-artifact@v7
        with:
          name: Pydox-Tests-Core-${{matrix.python-version}}-${{matrix.os}}
          path: ${{env.LOG_FILE}}
          retention-days: 90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cov.xml
          report_type: coverage
          flags: pinned, py${{matrix.python-version}}, ${{matrix.os}}
          name: codecov-github
          fail_ci_if_error: false
          env_vars: RUNNER_OS,PYTHON_VERSION

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          flags: pinned, py${{matrix.python-version}}, ${{matrix.os}}
          fail_ci_if_error: false
          env_vars: RUNNER_OS,PYTHON_VERSION
